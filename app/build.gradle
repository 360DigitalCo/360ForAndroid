plugins {
    id 'com.android.application'
}

android {
    namespace 'com.search360.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.search360.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "2.0.3"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
