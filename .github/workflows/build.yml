name: Build 360 APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Pinned: ubuntu-latest moves to Ubuntu 26 on Oct 19, 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # The runner already ships an Android SDK. The old android-actions/setup-android
      # step failed on `sdkmanager tools` and is not needed. This only makes sure the
      # packages we compile against are present, and never fails the job by itself.
      - name: Ensure Android SDK packages
        shell: bash
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Nice-to-have: never fail the run (or lose the debug APK) over this.
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        continue-on-error: true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: 360-apk-${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
